name: KiCad checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  erc:
    # This job's name is the required status check on main. Rename it here and in branch protection together.
    name: erc
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      # The image runs as user "kicad"; the checkout belongs to the runner, so run as root to read and write it.
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Use KiCad's default symbol and footprint libraries
        # A fresh container has no library tables, so ERC can't compare symbols to the library and warns on every one.
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/"

      - name: Electrical rules check (fails on any ERC error)
        run: |
          kicad-cli sch erc --severity-error --exit-code-violations --format report \
            -o erc-errors.rpt mv-telescope-hat/mv-telescope-hat.kicad_sch \
            || { cat erc-errors.rpt; exit 1; }

      - name: One project, unique references
        # kicad-cli's ERC skips KiCad's annotation check, so two parts both called J1 still pass ERC (PR #4 did).
        # This catches it, plus the usual cause: a sheet edited as its own project instead of through the .kicad_pro.
        if: always()
        run: |
          fail=0
          wrong=$(grep -n '(project "' mv-telescope-hat/*.kicad_sch | grep -v '(project "mv-telescope-hat"' \
            | sed -E 's/:[0-9]+:.*project "([^"]+)".*/ (saved by project "\1")/' | sort -u)
          if [ -n "$wrong" ]; then
            echo "::error::A sheet was edited outside the project: $wrong. Open mv-telescope-hat/mv-telescope-hat.kicad_pro and double-click your block; never open your .kicad_sch file on its own."
            fail=1
          fi
          kicad-cli sch export netlist --format kicadsexpr -o netlist.net mv-telescope-hat/mv-telescope-hat.kicad_sch > netlist.log 2>&1
          cat netlist.log
          dups=$(grep -A1 -E '^[[:space:]]*\(comp$' netlist.net | grep -oE '\(ref "[^"]+"' \
            | sed -E 's/.*"([^"]+)"/\1/' | sort | uniq -d | tr '\n' ' ')
          if [ -n "$dups" ]; then
            echo "::error::These references are used by more than one part: $dups. Annotate your sheet in its hundreds (README rule 4)."
            fail=1
          fi
          if grep -q "annotation errors" netlist.log; then
            echo "::error::KiCad reports annotation errors (a part without a number, or a number used twice)."
            fail=1
          fi
          exit $fail

      - name: Full ERC report (errors and warnings, to read)
        if: always()
        run: |
          kicad-cli sch erc --format report -o erc-full.rpt mv-telescope-hat/mv-telescope-hat.kicad_sch
          grep "ERC messages" erc-full.rpt

      - name: Schematic PDF (every sheet)
        if: always()
        run: kicad-cli sch export pdf -o mv-telescope-electrical.pdf mv-telescope-hat/mv-telescope-hat.kicad_sch

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: schematic
          path: |
            mv-telescope-electrical.pdf
            erc-full.rpt
            erc-errors.rpt

  draw:
    # Every sheet drawn before (main) and after (this pull request), for the picture comment made by schematic-diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - name: Check out this pull request (as GitHub would merge it)
        uses: actions/checkout@v7
        with:
          path: after

      - name: Check out main as the pull request sees it
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - name: Draw every sheet, in colour and in black and white
        run: |
          for side in before after; do
            sch="$side/mv-telescope-hat/mv-telescope-hat.kicad_sch"
            [ -f "$sch" ] || continue
            kicad-cli sch export svg -o "svg/$side/color" "$sch"
            kicad-cli sch export svg --black-and-white -o "svg/$side/bw" "$sch"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: schematic-svg
          path: svg

  schematic-diff:
    # Turns those drawings into before/after pictures and posts them as one comment on the pull request.
    # It never blocks a merge (not a required check). Forks get no comment: their token can't write here.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: draw
    runs-on: ubuntu-latest
    concurrency:
      group: schematic-diff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: write        # upload the pictures to the pr-previews release
      issues: write          # post or edit the comment
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: schematic-svg
          path: svg

      - name: Install the picture tools
        run: sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin python3-pil python3-numpy

      - name: Make the pictures
        run: |
          python3 .github/scripts/schematic_diff.py svg out --prefix "pr${PR}-${SHA::7}" --commit "$SHA" \
            --url-base "https://github.com/${GH_REPO}/releases/download/pr-previews"
          ls -la out

      - name: Upload the pictures and post or update the comment
        run: |
          marker='<!-- schematic-diff -->'
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id")
          existing=${existing%%$'\n'*}   # first match only (no pipe into head: pipefail + SIGPIPE)
          if [ ! -s out/comment.md ]; then
            printf '%s\nNo schematic changes compared with `main`.\n' "$marker" > out/comment.md
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@out/comment.md > /dev/null
            fi
            echo "No sheet changed."
            exit 0
          fi
          if ! gh release view pr-previews > /dev/null 2>&1; then
            gh release create pr-previews --prerelease --title "Pull request schematic pictures" \
              --notes "Pictures for the schematic-diff comment on each pull request. CI keeps only each pull request's newest set."
          fi
          # Drop this pull request's pictures from older commits (jq filters, so an empty list isn't an error).
          gh release view pr-previews --json assets \
            --jq ".assets[].name | select(startswith(\"pr${PR}-\") and (startswith(\"pr${PR}-${SHA::7}-\") | not))" \
            | while read -r old; do gh release delete-asset pr-previews "$old" --yes; done
          gh release upload pr-previews out/*.png --clobber
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@out/comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file out/comment.md
          fi

  publish:
    # After a merge to main, put the PDF on the "latest-schematic" release so there is one link that is always current.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: erc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: schematic

      - name: Update the latest-schematic release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view latest-schematic > /dev/null 2>&1; then
            gh release create latest-schematic --target "$GITHUB_SHA" \
              --title "Latest schematic (main)" \
              --notes "Rebuilt by CI after every merge to main. Download mv-telescope-electrical.pdf to see every sheet."
          fi
          gh release upload latest-schematic mv-telescope-electrical.pdf erc-full.rpt --clobber
